# Real client for rate limiting. Behind cloudflared every connection arrives from the
# tunnel, so $remote_addr is useless as a key; CF-Connecting-IP carries the visitor.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Scanner probes (.env, .git, wp-*, cred.txt, ...) are closed without a response body and
# never reach Flask. Mirrors app/utils/abuse_guard.py; edge rules: docs/cloudflare-waf.md.
map $uri $is_probe {
    default 0;
    "~*(^|/)\.(env|git|svn|hg|aws|ssh|docker|ds_store|htaccess|htpasswd|npmrc)" 1;
    "~*(^|/)(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|cgi-bin|actuator|server-status|boaform)" 1;
    "~*(^|/)(cred|creds|credentials|secrets?)\.(txt|json|ya?ml)$" 1;
    "~*\.(sql|bak)$" 1;
}

# 10 req/s sustained, bursts to 40 (a page load is ~20 requests, static included).
limit_req_zone $client_key zone=per_ip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Matches Flask's MAX_CONTENT_LENGTH. nginx's 1 MB default would reject batch-IP
    # CSV/XLSX uploads with a 413 before the app ever saw them.
    client_max_body_size 50M;

    # Long enough for a URL scan, which drives a real Chromium inside the request.
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # `debug` writes several lines per request and, on a public endpoint, is a disk-fill
    # vector for anyone who can send traffic.
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    if ($is_probe) {
        return 444;
    }

    location /admin {
        proxy_pass http://admin:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 504 /50x.html;
    }

    location / {
        limit_req zone=per_ip burst=40 nodelay;
        proxy_pass http://web:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 504 /50x.html;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
} 