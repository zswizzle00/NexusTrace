{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] bg-gradient-to-b from-gray-900 to-gray-800 px-2">
    <div class="w-full max-w-5xl mx-auto px-2 py-8 md:py-16">
        <div class="card bg-gray-800 border border-gray-700 p-8 md:p-14 space-y-12">
            <div class="text-center mb-4 md:mb-8">
                <h1 class="text-4xl md:text-6xl font-extrabold mb-4 md:mb-8 bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent">
                    Windows Event ID & AD Event Search
                </h1>
                <p class="text-lg md:text-2xl text-gray-300">
                    Search and analyze Windows Event IDs and Active Directory events for security insights.
                </p>
            </div>

            <!-- Search Form -->
            <div class="unified-search">
                <form action="/analyze" method="POST" class="search-form w-full flex flex-col sm:flex-row gap-4 md:gap-6 items-center justify-center">
                    <input type="text" 
                           name="indicator" 
                           placeholder="Enter Windows Event ID (e.g., 4624)" 
                           class="form-input bg-gray-700 border-gray-600 text-white placeholder-gray-400 focus:border-blue-500 focus:ring-blue-500 w-full text-lg md:text-xl py-4 md:py-5 px-4 md:px-6 rounded-lg" 
                           required>
                    <button type="submit" class="btn btn-primary whitespace-nowrap w-full sm:w-auto text-lg md:text-xl py-4 md:py-5 px-6 md:px-8 flex items-center justify-center">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        Search
                    </button>
                </form>
            </div>

            <!-- Results Section -->
            <div id="searchResults" class="hidden">
                <div class="card bg-gray-800 border border-gray-700 p-6">
                    <h2 class="text-2xl font-bold text-blue-400 mb-6">Event Details</h2>
                    <div id="eventDetails" class="space-y-6">
                        <!-- Event details will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-900/50 border border-red-700 text-red-200 rounded-lg"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('eventSearchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const eventId = document.getElementById('eventId').value;
    const resultsDiv = document.getElementById('searchResults');
    const errorDiv = document.getElementById('errorMessage');
    const eventDetails = document.getElementById('eventDetails');
    
    try {
        const response = await fetch('/api/event/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `event_id=${encodeURIComponent(eventId)}`
        });
        
        const data = await response.json();
        
        if (response.ok) {
            errorDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            // Populate event details
            eventDetails.innerHTML = `
                <div class="grid gap-6 md:grid-cols-2">
                    <div class="card bg-gray-700 border border-gray-600 p-4">
                        <h3 class="text-lg font-semibold text-blue-400 mb-2">Basic Information</h3>
                        <div class="space-y-2">
                            <p class="flex justify-between">
                                <span class="text-gray-400">Event ID:</span>
                                <span class="text-white">${data.event_id}</span>
                            </p>
                            <p class="flex justify-between">
                                <span class="text-gray-400">Title:</span>
                                <span class="text-white">${data.title || 'N/A'}</span>
                            </p>
                        </div>
                    </div>
                    <div class="card bg-gray-700 border border-gray-600 p-4">
                        <h3 class="text-lg font-semibold text-blue-400 mb-2">Summary</h3>
                        <p class="text-gray-300">${data.summary || 'No summary available'}</p>
                    </div>
                </div>
                ${data.details_table.length > 0 ? `
                <div class="card bg-gray-700 border border-gray-600 p-4 mt-4">
                    <h3 class="text-lg font-semibold text-blue-400 mb-2">Details Table</h3>
                    <div class="overflow-x-auto">
                        <table class="table">
                            <tbody>
                                ${data.details_table.map(row => `
                                    <tr class="border-b border-gray-600">
                                        ${row.map(cell => `<td class="py-2 px-4 text-gray-300">${cell}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                ` : ''}
                ${data.fields ? `
                <div class="card bg-gray-700 border border-gray-600 p-4 mt-4">
                    <div class="flex items-center justify-end gap-2 mb-2">
                        <button 
                            type="button"
                            class="btn btn-secondary text-sm"
                            onclick="const details = this.parentElement.nextElementSibling; details.classList.toggle('hidden'); this.querySelector('span').textContent = details.classList.contains('hidden') ? 'Show' : 'Hide';"
                        >
                            <span>Hide</span> Field Details
                        </button>
                        <button 
                            type="button"
                            class="btn btn-primary text-sm"
                            onclick="navigator.clipboard.writeText(this.closest('.card').querySelector('.field-details-box').textContent);"
                        >
                            Copy
                        </button>
                    </div>
                    <div class="field-details-box max-h-64 overflow-auto bg-gray-800 rounded p-3 font-mono text-sm text-gray-200 whitespace-pre-wrap border border-gray-600">
                        ${data.fields}
                    </div>
                </div>
                ` : ''}
            `;
        } else {
            throw new Error(data.error || 'Failed to fetch event information');
        }
    } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        resultsDiv.classList.add('hidden');
    }
});
</script>
{% endblock %}
