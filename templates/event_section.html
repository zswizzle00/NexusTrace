{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-blue-500">Windows Event ID & AD Event Search</h1>
        
        <!-- Event Search Form -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <form id="eventSearchForm" class="space-y-4">
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" 
                           id="eventId" 
                           name="event_id" 
                           placeholder="Enter Windows Event ID (e.g., 4624)" 
                           class="flex-1 px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                           required>
                    <button type="submit" 
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800">
                        Search
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="searchResults" class="hidden">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4 text-blue-400">Event Details</h2>
                <div id="eventDetails" class="space-y-4">
                    <!-- Event details will be populated here -->
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mt-4 p-4 bg-red-900 text-red-200 rounded-lg"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('eventSearchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const eventId = document.getElementById('eventId').value;
    const resultsDiv = document.getElementById('searchResults');
    const errorDiv = document.getElementById('errorMessage');
    const eventDetails = document.getElementById('eventDetails');
    
    try {
        const response = await fetch('/event/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `event_id=${encodeURIComponent(eventId)}`
        });
        
        const data = await response.json();
        
        if (response.ok) {
            errorDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            
            // Populate event details
            eventDetails.innerHTML = `
                <div class="grid gap-6 md:grid-cols-2">
                    <div class="bg-gray-900 rounded-2xl shadow-lg p-6 flex flex-col mb-6">
                        <h3 class="text-lg font-semibold text-blue-400 mb-2">Basic Information</h3>
                        <p><span class="text-gray-400">Event ID:</span> ${data.event_id}</p>
                        <p><span class="text-gray-400">Title:</span> ${data.title || 'N/A'}</p>
                    </div>
                    <div class="bg-gray-900 rounded-2xl shadow-lg p-6 flex flex-col mb-6">
                        <h3 class="text-lg font-semibold text-blue-400 mb-2">Summary</h3>
                        <p class="text-gray-300">${data.summary || 'No summary available'}</p>
                    </div>
                </div>
                ${data.details_table.length > 0 ? `
                <div class="bg-gray-900 rounded-2xl shadow-lg p-6 flex flex-col mb-6 mt-4">
                    <h3 class="text-lg font-semibold text-blue-400 mb-2">Details Table</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-gray-300">
                            <tbody>
                                ${data.details_table.map(row => `
                                    <tr class="border-b border-gray-600">
                                        ${row.map(cell => `<td class="py-2 px-4">${cell}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                ` : ''}
                ${data.fields ? `
                <div class="bg-gray-900 rounded-2xl shadow-lg p-6 flex flex-col mb-6 mt-4">
                    <div class="flex items-center justify-end gap-2 mb-2 border border-gray-600 bg-gray-800 rounded p-2">
                        <button 
                            type="button"
                            class="text-blue-400 font-semibold focus:outline-none"
                            onclick="const details = this.parentElement.nextElementSibling; details.classList.toggle('hidden'); this.querySelector('span').textContent = details.classList.contains('hidden') ? 'Show' : 'Hide';"
                        >
                            <span>Hide</span> Field Details
                        </button>
                        <button 
                            type="button"
                            class="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700 focus:outline-none"
                            onclick="navigator.clipboard.writeText(this.closest('.bg-gray-900').querySelector('.field-details-box').textContent);"
                        >
                            Copy
                        </button>
                    </div>
                    <div class="field-details-box max-h-64 overflow-auto bg-gray-900 rounded p-3 font-mono text-sm text-gray-200 whitespace-pre-wrap border border-gray-600">
                        ${data.fields}
                    </div>
                </div>
                ` : ''}
            `;
        } else {
            throw new Error(data.error || 'Failed to fetch event information');
        }
    } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        resultsDiv.classList.add('hidden');
    }
});
</script>
{% endblock %}
