{# Shared page header, so every page opens the same way: a left-aligned title on the
   container edge and one line on what the page does. #}
{% macro page_header(title, description) -%}
  <div class="nt-page-head">
    <h1 class="nt-page-title">{{ title }}</h1>
    {% if description %}<p class="nt-page-desc">{{ description }}</p>{% endif %}
  </div>
{%- endmacro %}
