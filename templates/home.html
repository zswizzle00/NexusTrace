{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] px-4 py-8">
    <div class="w-full max-w-2xl mx-auto">
        <div class="card bg-[#181A20] border border-[#232946] rounded-2xl shadow-xl p-6 transition-all duration-200 space-y-6 text-gray-200 text-center">
            <!-- Header Section with Border -->
            <div class="mb-6 pb-6 border-b border-gray-700">
                <h1 class="text-2xl md:text-4xl lg:text-5xl font-extrabold mb-3 md:mb-6 bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent leading-tight flex items-center justify-center gap-2">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 4v5c0 5.25-3.5 9.74-7 11-3.5-1.26-7-5.75-7-11V7l7-4z"/>
                      </svg>
                    NexusTrace
                </h1>
                <p class="text-sm md:text-base lg:text-xl text-gray-400 px-2">
                    A tool for analyzing IP addresses, domains, URLs, user-agent strings, and file hashes — with additional support for Windows Event Logs and Azure Error Logs searches.
                </p>
            </div>
            <!-- Search Bar -->
            <form class="search-form w-full mx-auto" action="/analyze" method="POST">
                <input class="search-input" type="text" name="indicator" placeholder="Enter IP, domain, URL, hash, or user agent..." required />
                <button class="btn btn-primary" type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                    Analyze
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
