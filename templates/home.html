{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center flex-grow text-center px-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold mb-6 bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent">
            Welcome to NexusTrace
        </h1>
        <p class="text-lg md:text-xl text-gray-300 mb-10">
            A comprehensive OSINT and threat intelligence platform for analyzing IP addresses, domains, URLs, and hashes.
        </p>
        <!-- Unified Search Bar -->
        <div class="unified-search mt-4 mb-10">
          <form action="/analyze" method="POST" class="search-form flex flex-col sm:flex-row gap-4 justify-center items-center">
            <input type="text" name="indicator" placeholder="Enter IP, domain, URL, hash, or email..." class="search-input input-field w-full sm:w-96" required>
            <button type="submit" class="btn btn-primary">Analyze</button>
          </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Add any necessary JavaScript here
</script>
{% endblock %}
