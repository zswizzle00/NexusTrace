{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
  <div class="mb-4 px-4 py-3 rounded text-sm
    {% if category == 'error' %}bg-red-900/30 text-red-300 border border-red-800
    {% elif category == 'success' %}bg-green-900/30 text-green-300 border border-green-800
    {% else %}bg-blue-900/30 text-blue-300 border border-blue-800{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
{% endwith %}
