{% extends "base.html" %}
{% block content %}
<div class="w-full px-4 py-10">
    <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-4 text-center mx-auto">Domain Analysis</h2>
    <p class="text-gray-300 mb-10 text-lg text-center">Analyze domains for WHOIS information, DNS records, and SSL certificates.</p>
    <div id="domain-section" class="w-full">
        <form id="domain-form" class="mb-8 w-full bg-gray-800/80 rounded-2xl border border-gray-700 p-8 shadow-xl">
            <label for="domain-input" class="block text-lg font-semibold text-white mb-2">Enter Domain for Analysis</label>
            <div class="flex flex-col md:flex-row gap-4 mb-4 w-full">
                <input type="text" id="domain-input" name="domain" placeholder="e.g., example.com" required class="flex-1 rounded-lg px-4 py-3 bg-gray-900 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button type="submit" class="px-6 py-3 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-500 transition-colors duration-200">Analyze Domain</button>
            </div>
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-300 mb-1">Or Upload Domain List</label>
                <div class="flex flex-col md:flex-row gap-4 items-center w-full">
                    <input type="file" id="file-input" class="hidden" accept=".csv,.xlsx,.txt" onchange="handleFileUpload(this)">
                    <label for="file-input" class="file-label cursor-pointer px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600">Choose File</label>
                    <span id="file-name" class="ml-2 text-gray-400">No file chosen</span>
                    <button onclick="processFile()" id="process-file-btn" disabled class="px-4 py-2 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-500 ml-4 disabled:opacity-50 disabled:cursor-not-allowed">Process File</button>
                </div>
                <p class="mt-2 text-sm text-gray-400">Supported formats: CSV, XLSX, TXT (one domain per line)</p>
            </div>
        </form>
        <!-- Loading Indicator -->
        <div id="domain-loading" class="loading hidden">
            <div class="loading-spinner"></div>
            <p class="loading-text">Analyzing domain...</p>
        </div>
        <!-- Progress Bar -->
        <div id="progress-bar" class="w-full hidden">
            <span class="progress-label" id="progress-label"></span>
            <div class="progress-bar-inner" style="width: 0%">
                <div class="progress-bar-stripes"></div>
            </div>
        </div>
        <div id="domain-results" class="space-y-12 mt-10 hidden">
            <!-- WHOIS Information Section -->
            <section>
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-blue-600 text-white rounded-full p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h3 class="text-2xl font-bold text-white tracking-tight">WHOIS Information</h3>
                </div>
                <div id="whois-content" class="grid w-full gap-8" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));"></div>
            </section>
            <!-- DNS Records Section -->
            <section>
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-green-600 text-white rounded-full p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                    </div>
                    <h3 class="text-2xl font-bold text-white tracking-tight">DNS Records</h3>
                </div>
                <div id="dns-records" class="grid w-full gap-8" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));"></div>
            </section>
            <!-- SSL Certificate Section -->
            <section>
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-yellow-500 text-white rounded-full p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    <h3 class="text-2xl font-bold text-white tracking-tight">SSL Certificate</h3>
                </div>
                <div id="ssl-info" class="grid w-full gap-8" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));"></div>
            </section>
        </div>
    </div>
</div>
{% endblock %}
