{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto">
        <div class="card bg-gray-800 border border-gray-700">
            <h2 class="text-4xl font-bold text-blue-400 mb-6">IP Address Search</h2>
            <form method="post" action="/analyze" class="space-y-4">
                <div class="flex flex-col space-y-2">
                    <label for="indicator" class="text-gray-300">Enter IP Address</label>
                    <div class="relative">
                        <input
                            type="text"
                            id="indicator"
                            name="indicator"
                            placeholder="Enter IPv4 or IPv6 address"
                            class="form-input bg-gray-700 border-gray-600 text-white placeholder-gray-400 focus:border-blue-500 focus:ring-blue-500 w-full"
                            required
                        />
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m13-3.13V7a4 4 0 00-4-4H7a4 4 0 00-4 4v6a4 4 0 004 4h6"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <button
                    type="submit"
                    class="btn btn-primary w-full"
                >
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m13-3.13V7a4 4 0 00-4-4H7a4 4 0 00-4 4v6a4 4 0 004 4h6"/>
                    </svg>
                    Search IP
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
