{% extends "base.html" %}

{% block title %}CyberChef - NexusTrace{% endblock %}

{% block main_content_class %}p-0 m-0 w-screen max-w-none h-full{% endblock %}

{% block content %}
<style>
html, body, .app-container, .main-content {
  height: 100%;
  min-height: 100vh;
}
.cyberchef-iframe-container {
  position: fixed;
  top: 4.5rem; /* Adjust if your header is taller/shorter */
  left: 0;
  width: 100vw;
  height: calc(100vh - 4.5rem);
  z-index: 10;
  background: transparent;
}
.cyberchef-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #181f2a;
}
</style>
<div class="cyberchef-iframe-container">
    <iframe 
        id="cyberchef-frame"
        src="/cyberchef_app/"
        class="cyberchef-iframe"
        title="CyberChef Interface"
        aria-label="CyberChef Interactive Interface"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
    ></iframe>
</div>
{% endblock %}
