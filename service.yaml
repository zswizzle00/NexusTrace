# Cloud Run service manifest. Not read by docker-compose.yml or the VM deployment. Full
# procedure, including the Secret Manager entries: docs/cloud-run.md.
#
#   gcloud run services replace service.yaml --region <REGION>
#
# Replace every PROJECT_ID / REGION / BUCKET placeholder first. Authoritative: `services
# replace` removes anything not named here, so never mix it with ad-hoc
# `gcloud run deploy --set-env-vars`; change the file and re-apply.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexustrace
  annotations:
    # 'internal-and-cloud-load-balancing' instead is the only way to put Cloud Armor or
    # IAP in front of it.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Cold starts run to tens of seconds (307 MB venv, plus Chromium to launch). min 1
        # also keeps the cache-clearing daemon thread alive between requests.
        autoscaling.knative.dev/minScale: "1"
        # maxScale 1 is deliberate, not a cost default:
        #  1. Rate limiters (app/utils/rate_limiter.py) are per-process singletons.
        #     VirusTotal's free tier is 4 req/MINUTE, so a second instance silently turns
        #     compliance into 429s.
        #  2. With STORAGE_BACKEND=local each instance has its own in-memory filesystem, so
        #     listings differ per instance and result pages 404 depending who answers.
        # Raise it only after STORAGE_BACKEND=gcs is in place AND you accept the multiplied
        # provider rate.
        autoscaling.knative.dev/maxScale: "1"
        # gen1's gVisor is a poor host for Chromium.
        run.googleapis.com/execution-environment: gen2
        # CPU always allocated, for two background behaviours that otherwise never run: the
        # 30-minute cache-clearing daemon thread in app/utils/cache.py, and any straggler
        # enrichment thread outliving its request (ENRICH_DEADLINE detaches, it does not
        # cancel). Costs the instance's full lifetime, roughly 3x to 4x request billing;
        # "true" instead leaves caches to expire lazily on each function's own TTL.
        run.googleapis.com/cpu-throttling: "false"
        # Startup only, so the first boot's import cost does not mean paying 4 vCPU
        # steady-state.
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Match gunicorn's --threads 8 exactly. At Cloud Run's default of 80, seventy-two
      # requests queue behind eight threads each holding a live Chromium for ~30s+, blowing
      # through both gunicorn's --timeout 120 and timeoutSeconds below. Pinned to the thread
      # count, the waiting happens in Cloud Run's own queue where metrics can see it.
      containerConcurrency: 8
      # Must exceed gunicorn's --timeout 120, so a hung worker is killed by gunicorn (logged,
      # 502) rather than cut off by the platform as an unattributable 504.
      timeoutSeconds: 180
      # Least privilege: secretmanager.secretAccessor on the secrets below and object
      # read/write on GCS_BUCKET, nothing more. Never the default compute service account
      # (project-wide Editor). The scanner fetches attacker-supplied URLs, so treat this
      # identity as reachable; see docs/cloud-run.md.
      serviceAccountName: nexustrace-run@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - name: nexustrace
          image: REGION-docker.pkg.dev/PROJECT_ID/nexustrace/nexustrace:TAG
          ports:
            # Cloud Run injects PORT with this value and the Dockerfile CMD binds
            # ${PORT:-${FLASK_PORT:-5050}}, so one image serves both here and Compose. Do not
            # also set a PORT env var: it is reserved and would be rejected.
            - name: http
              containerPort: 8080
          resources:
            limits:
              # Chromium rendering is CPU-bound and Cloud Run's own minimums require >= 2 CPU
              # at 4Gi. At 1 CPU two concurrent scans serialize and both near the 120s timeout.
              cpu: "2"
              # ~250 MB base (Python, Flask, the MMDB reader), ~350 MB per in-flight scan
              # (--disable-dev-shm-usage means Chromium is all heap, no /dev/shm to spill
              # into), ~100 MB for PNG buffers. Worst case eight concurrent scans is 2.8 GB,
              # leaving ~700 MB headroom. A ceiling, not a number to leave alone: with
              # STORAGE_BACKEND=local every scan JSON and screenshot is written to an
              # IN-MEMORY filesystem and charged here, and OOM kills the instance rather than
              # the request. Above ~70% utilization, drop --threads and containerConcurrency
              # to 4 together; four concurrent Chromiums is cheaper than more memory.
              memory: 4Gi
          env:
            # Google's front end terminates HTTPS and X-Forwarded-Proto arrives as https.
            - name: SECURE_COOKIES
              value: "true"
            # The container filesystem is in-memory and per-instance. See .env.example.
            - name: STORAGE_BACKEND
              value: gcs
            - name: GCS_BUCKET
              value: BUCKET_NAME
            # HARD PREREQUISITE. Without a fixed value app/__init__.py generates a per-process
            # random key, and every revision, restart or extra instance invalidates the CSRF
            # tokens and sessions minted by the last one; form POSTs then fail at random.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-secret-key
                  key: latest
            # Provider keys are all optional in the app, but a secretKeyRef to a secret that
            # does not exist is a HARD DEPLOY FAILURE. Delete the blocks you have no key for
            # rather than pointing them at empty secrets.
            - name: VPNAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-vpnapi-key
                  key: latest
            - name: IPINFO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexustrace-ipinfo-token
                  key: latest
            - name: SHODAN_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-shodan-key
                  key: latest
            - name: ABUSEIPDB_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-abuseipdb-key
                  key: latest
            - name: PROXYCHECK_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-proxycheck-key
                  key: latest
            - name: IP2LOCATION_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-ip2location-key
                  key: latest
            - name: IP2WHOIS_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-ip2whois-key
                  key: latest
            - name: URLSCAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-urlscan-api-key
                  key: latest
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-virustotal-api-key
                  key: latest
            - name: ALIENVAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-alienvault-key
                  key: latest
            # One key for MalwareBazaar / ThreatFox / URLhaus, mandatory as of 2026: without
            # it they return 401 and report unavailable rather than "nothing known".
            - name: ABUSECH_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: nexustrace-abusech-auth-key
                  key: latest
          # /api/health does no network I/O and touches no optional config, so polling is safe.
          startupProbe:
            httpGet:
              path: /api/health
            # 12 x 10s = 120s, inside Cloud Run's 240s budget. A tighter probe restart-loops a
            # container that would have come up fine.
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
            # Deliberately slack: with all 8 threads held by scans a health request waits for
            # one, and restarting a busy instance loses its in-flight scans.
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
