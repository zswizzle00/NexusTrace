[project]
name = "nexustrace"
version = "1.0.0"
description = "Flask-based OSINT analysis tool aggregating multiple threat intelligence APIs into a unified web interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.2",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "Pillow==11.2.1",
    "ipinfo==2.0.0",
    "pandas==2.2.1",
    "openpyxl==3.1.2",
    "shodan==1.31.0",
    "urllib3==2.1.0",
    "Werkzeug==3.0.1",
    "click==8.1.7",
    "itsdangerous==2.1.2",
    "Jinja2==3.1.3",
    "MarkupSafe==2.1.5",
    "numpy==1.26.4",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "six==1.16.0",
    "dnspython==2.6.1",
    "python-whois==0.8.0",
    "beautifulsoup4==4.12.3",
    "builtwith==1.3.4",
    "pyOpenSSL==24.0.0",
    "python-json-logger==2.0.7",
    "gunicorn==21.2.0",
    "geoip2==4.8.0",
    "OTXv2==1.5.12",
    "Flask-WTF==1.2.1",
    "flask-talisman==1.1.0",
    # Pinned, not a floor: the browser binary is downloaded per-version in the Docker
    # build, so a drifting library version silently mismatches the installed Chromium.
    "playwright==1.61.0",
    # Public Suffix List for validators.registrable_domain(). Pinned exactly on
    # purpose: the trailing date IS the bundled PSL snapshot date, so the pin is
    # the staleness signal. Refreshing the list = bump this pin, then
    # `uv lock && uv export --no-dev --no-hashes -o requirements.txt` (Docker
    # installs from requirements.txt, not from this file).
    "publicsuffixlist==1.0.2.20260726",
]

# Optional, and deliberately not a base dependency: app/utils/storage.py imports
# google.cloud.storage lazily inside its GCS backend, so the default local/Docker
# deployment never needs this installed. Only a Cloud Run image (STORAGE_BACKEND=gcs)
# does, and it must install the extra explicitly - `uv export --no-dev` does NOT
# include extras, so google-cloud-storage is absent from requirements.txt by design:
#     uv export --no-dev --no-hashes --extra gcs -o requirements-gcs.txt
#   or, on top of the base image:
#     pip install "google-cloud-storage==3.13.0"
[project.optional-dependencies]
gcs = [
    "google-cloud-storage==3.13.0",
]

# No [build-system] table on purpose: NexusTrace is a deployable application, not an
# installable library. uv therefore manages the environment without trying to build/install
# the project itself.
