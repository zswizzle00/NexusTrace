[project]
name = "nexustrace"
version = "1.0.0"
description = "Flask-based OSINT analysis tool aggregating multiple threat intelligence APIs into a unified web interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.2",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "Pillow==11.2.1",
    "ipinfo==2.0.0",
    "pandas==2.2.1",
    "openpyxl==3.1.2",
    "shodan==1.31.0",
    "urllib3==2.1.0",
    "Werkzeug==3.0.1",
    "click==8.1.7",
    "itsdangerous==2.1.2",
    "Jinja2==3.1.3",
    "MarkupSafe==2.1.5",
    "numpy==1.26.4",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "six==1.16.0",
    "dnspython==2.6.1",
    "python-whois==0.8.0",
    "beautifulsoup4==4.12.3",
    "builtwith==1.3.4",
    "pyOpenSSL==24.0.0",
    "python-json-logger==2.0.7",
    "gunicorn==21.2.0",
    "geoip2==4.8.0",
    "OTXv2==1.5.12",
    "Flask-WTF==1.2.1",
    "flask-talisman==1.1.0",
    # A base dependency, not an extra: /admin's authorization depends on it and `uv export
    # --no-dev` omits extras, so an extra would be silently missing from the Docker image.
    # RS256 needs `crypto`, which resolves to the cryptography pin pyOpenSSL already brings
    # in above; do not move that pin.
    "PyJWT[crypto]==2.10.1",
    # Pinned, not a floor: the browser binary is downloaded per-version in the Docker
    # build, so a drifting library version silently mismatches the installed Chromium.
    "playwright==1.61.0",
    # The trailing date IS the bundled Public Suffix List snapshot date, so this pin is the
    # staleness signal for validators.registrable_domain(). Refreshing the list means bumping
    # it, then `uv lock && uv export --no-dev --no-hashes -o requirements.txt` (Docker
    # installs from requirements.txt, not from this file).
    "publicsuffixlist==1.0.2.20260726",
    # The bundled metadata IS the intel, so this pin is exact for the same reason the
    # publicsuffixlist pin is: a version bump silently changes what a lookup returns
    # with no code change here. Apache-2.0. Do NOT substitute `phonenumberslite`, which
    # ships no geodata/carrierdata/tzdata, so geocoder, carrier and timezone all raise
    # ModuleNotFoundError.
    "phonenumbers==9.0.39",
    # Both pinned exactly because the bundled SITE LISTS are the product: a version bump
    # silently changes which platforms are checked, and therefore what a scan reports,
    # with no code change in this repo. Same reasoning as the publicsuffixlist pin.
    #
    # user-scanner is used as a LIBRARY ONLY, via user_scanner.core.orchestrator and
    # user_scanner.core.email_orchestrator. Never import user_scanner.__main__ or
    # anything under user_scanner.utils: that is where its three blocking input()
    # prompts and its pip-based self-updater live.
    "sherlock-project==0.16.2",
    "user-scanner==1.5.2",
]

# Deliberately not a base dependency: storage.py imports it lazily, so only a Cloud Run
# image (STORAGE_BACKEND=gcs) needs it. `uv export --no-dev` omits extras, so it is absent
# from requirements.txt by design; install it with
# `uv export --no-dev --no-hashes --extra gcs -o requirements-gcs.txt`, or on top of the
# base image with `pip install "google-cloud-storage==3.13.0"`.
[project.optional-dependencies]
gcs = [
    "google-cloud-storage==3.13.0",
]

# No [build-system] table on purpose: NexusTrace is a deployable application, not an
# installable library, so uv manages the environment without trying to build the project.
