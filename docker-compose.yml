version: '3.8'

services:
  web:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - app_logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app_logs:
    driver: local
  nginx_logs:
    driver: local
