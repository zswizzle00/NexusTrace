version: '3.8'

services:
  web:
    build: .
    expose:
      - "5050"
    volumes:
      - app_logs:/app/logs
    env_file:
      - .env
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_logs:
    driver: local
