version: '3.8'

services:
  web:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - app_logs:/app/logs
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always

volumes:
  app_logs:
    driver: local
