services:
  web:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - app_logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Pinned explicitly so a NEXUSTRACE_ROLE left in .env cannot promote the
      # internet-facing process to the admin role. `environment` beats `env_file`.
      - NEXUSTRACE_ROLE=public
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
    restart: always
    # Python, not curl: the slim image has none.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5050/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app_network

  # The same image as `web`, run again with NEXUSTRACE_ROLE=admin. The admin blueprint is
  # registered only here; on `web` there is no /admin rule in the url_map at all, so there
  # is nothing on the public process to probe or brute-force.
  admin:
    build: .
    ports:
      # Published on all interfaces so it is reachable on the local network.
      # Make sure ADMIN_TOKEN is set: the token is the only door when Cloudflare
      # Access is not in use, and /admin returns 404 without it.
      - "5051:5051"
    volumes:
      - app_logs:/app/logs
      # The same records as `web`. This container is less REACHABLE, not less privileged:
      # it has full read/write access to every stored record, which is why ADMIN_TOKEN and
      # Cloudflare Access still apply inside it.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NEXUSTRACE_ROLE=admin
      # No FLASK_HOST: the Dockerfile CMD always binds 0.0.0.0 inside the container, and
      # the loopback publish above is what limits who can connect.
      - FLASK_PORT=5051
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5051/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      # Deliberately NOT app_network. nginx is the one container published to the LAN, and
      # keeping it off this network means it cannot reach the admin service even if its
      # config later grows a stray proxy_pass.
      - admin_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  admin_network:
    driver: bridge

volumes:
  app_logs:
    driver: local
  nginx_logs:
    driver: local
